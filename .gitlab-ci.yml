stages:
  - test
  - deploy

test-job:
  stage: test
  before_script: cp "$ENV_TEST" .env-test
  script:
    - docker compose --env-file .env-test -f docker-compose.test.yml up -d
    - |
      for i in {1..20}; do
        docker compose -f docker-compose.test.yml exec test_db pg_isready && break
        sleep 1
      done
    - uv pytest -v
  after_script:
    - docker compose -f docker-compose.test.yml down
  only:
    - main

deploy-job:
  stage: deploy
  before_script: cp "$ENV" .env
  script:
    - docker compose build
    - docker compose down
    - docker compose up -d
  only:
    - main
