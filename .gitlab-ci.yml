stages:
  - build
  - deploy

build-job:
  stage: build
  before_script:
    - cp ${ENV} .env
  script:
    - docker build -t intpoln/taskflow .
  only:
    - main

deploy-job:  
  stage: deploy
  before_script:
    - cp ${ENV} .env
  script:
    - docker compose down
    - docker compose up -d
  only:
    - main
  needs:
    - build-job