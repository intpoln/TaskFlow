  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: broker
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    networks:
      - taskflow_network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 15s
      retries: 3
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped


  redis:
    image: redis:8.4
    container_name: cache
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.1"
    networks:
      - taskflow_network
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"


  backend:
    image: intpoln/taskflow:latest
    container_name: backend
    networks:
      - taskflow_network
    mem_limit: 128m
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      #      postgres:
      #        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      bash -c "alembic upgrade head &&
      python -m src.scripts.create_superuser &&
      gunicorn src.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --forwarded-allow-ips='*'"
    restart: unless-stopped
  

  celery_worker:
    image: intpoln/taskflow:latest
    container_name: celery
    networks:
      - taskflow_network
    mem_limit: 64m
    cpus: "0.1"
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: celery -A src.tasks.celery_app:celery_instance worker
    restart: unless-stopped

networks:
  taskflow_network:

volumes:
  rabbitmq-data:
#  pgdata: