services:

  postgres:
    image: postgres:18
    container_name: pg
    mem_limit: 256m
    cpus: "0.25"
    networks:
      - taskflow_network
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:8.4
    container_name: cache
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.1"
    networks:
      - taskflow_network
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"


  taskflow_backend_service:
    container_name: back
    networks:
      - taskflow_network
    image: intpoln/taskflow:latest
    mem_limit: 128m
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      bash -c "alembic upgrade head
      && python -m src.scripts.create_superuser
      && gunicorn src.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"


