services:

  postgres:
    image: postgres:latest
    container_name: pg
    networks:
      - taskflow_network
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=taskflow
    volumes:
      - ./postgres/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: cache
    networks:
      - taskflow_network
    command: redis-server --requirepass RedisPassword
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  taskflow_backend_service:
    container_name: taskflow_backend
    networks:
      - taskflow_network
    image: intpoln/taskflow:latest
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python src/main.py

  taskflow_celery_service:
    container_name: taskflow_celery
    networks:
      - taskflow_network
    image: intpoln/taskflow:latest
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery --app src.tasks.celery_app:celery_instance worker -l INFO -B

networks:
  taskflow_network: