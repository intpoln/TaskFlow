services:

  test_db:
    image: postgres:18
    container_name: pg
    mem_limit: 256m
    cpus: "0.25"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}

